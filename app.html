    /* The ring a control shows while it has keyboard focus: on Tab, not

    :focus-visible {
      outline: 2px solid rgb(var(--text_color));

    button, p, input {

    .reload-indicator {

    }

      width: 14px;

      border-top-color: #fff;
      border-radius: 50%;

    }

    @keyframes spin {

    /* A screenshot comes in both themes (Home.zig's Shot); the page shows
       its own theme's one. */
    [data-shot] {
      display: block;
    }

    [data-shot="dark"],
    [data-theme="dark"] [data-shot="light"] {
      display: none;
    }

    [data-theme="dark"] [data-shot="dark"] {
      display: block;
    }

    /* The site's feature rows that put their screenshot on the left; doubled
       to outrank the element's own class. A phone stacks them all alike. */
    [data-flip="true"][data-flip="true"] {
      flex-direction: row-reverse;
    }

    /* A feature's text keeps level with the top of its screenshot, and in
       view while a tall one scrolls past. */
    [data-beside="true"] {
      flex: 1 1 340px;
      min-width: 0;
      position: sticky;
      top: 48px;
      align-self: flex-start;
    }

    /* A feature's screenshots: the larger share of its row. */
    [data-shots="true"] {
      flex: 2 1 560px;
      min-width: 0;
    }

    @media (max-width: 767px) {
      [data-flip="true"][data-flip="true"] {
        flex-direction: column;
      }

      /* Stacked, a basis would be a height. */
      [data-beside="true"],
      [data-shots="true"] {
        flex: none;
        width: 100%;
        position: static;
        align-self: stretch;
      }
    }
